<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English & French Learning App</title>
    <style>
        /* --- 介面風格設計 (CSS) - Lady B 復古配色版 --- */
        :root {
            --color-primary-red: #7D2027;   /* 酒紅 */
            --color-chic-blue: #5FA8C2;     /* 復古藍 */
            --color-burnt-orange: #CF5527;  /* 焦糖橘 */
            --color-deep-brown: #673C34;    /* 深棕 */
            --color-cream: #FAE3B1;         /* 奶油黃 */
            
            --color-bg: #FDFBF6;            /* 極淡米色背景 */
            --color-card-bg: #FFFFFF;       /* 卡片白 */
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-deep-brown);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--color-primary-red);
            color: #FFFFFF;
            padding: 20px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(125, 32, 39, 0.3);
            cursor: pointer;
            z-index: 10;
        }

        .container {
            padding: 20px;
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: var(--color-card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(103, 60, 52, 0.08);
            margin-bottom: 20px;
            line-height: 1.8;
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }
        
        .lesson-card {
            cursor: pointer;
            border-left: 6px solid var(--color-chic-blue);
        }
        .lesson-card:active {
            transform: scale(0.98);
            background-color: #f9f9f9;
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 按鈕樣式 */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background-color: var(--color-chic-blue);
            color: #FFFFFF;
            text-align: center;
            border: none;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--color-chic-blue);
            color: var(--color-chic-blue);
        }

        .btn-back {
            background-color: #EFEFEF;
            color: var(--color-deep-brown);
            margin-top: 30px;
        }

        /* 文字樣式 */
        .date-tag {
            font-size: 0.85rem;
            color: #998731;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .article-title {
            color: var(--color-burnt-orange);
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 800;
            line-height: 1.3;
        }
        .english-text {
            font-size: 1.1rem;
            text-align: justify;
            margin-bottom: 30px;
            color: #4a3b38;
        }

        /* 單字列表樣式 */
        .vocab-item {
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .vocab-item:last-child { border-bottom: none; }
        
        .vocab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }
        
        .vocab-en { 
            font-weight: bold; 
            color: var(--color-chic-blue); 
            font-size: 1.2rem; 
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .vocab-en:active { opacity: 0.6; }
        
        .speaker-icon {
            font-size: 0.9rem;
            margin-left: 8px;
            background-color: #eee;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }

        .vocab-zh { 
            color: var(--color-deep-brown); 
            font-size: 1rem; 
            font-weight: bold;
        }
        
        /* 法文標籤樣式 */
        .vocab-fr-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            color: var(--color-primary-red); 
            font-size: 1rem; 
            font-weight: bold;
            font-style: italic;
            cursor: pointer;
        }
        .vocab-fr-row:active { opacity: 0.6; }

        .vocab-ex {
            font-size: 0.95rem;
            color: #666;
            font-style: italic;
            background-color: #FAFAFA;
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--color-cream);
            line-height: 1.4;
            cursor: pointer;
            margin-top: 8px;
        }
        
        /* 法文例句樣式 */
        .vocab-ex-fr {
            font-size: 0.95rem;
            color: #7D2027; /* 酒紅 */
            font-style: italic;
            background-color: #FFF5F5; /* 淡紅背景 */
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--color-primary-red);
            line-height: 1.4;
            cursor: pointer;
            margin-top: 8px;
        }

        /* 測驗區塊樣式 */
        .quiz-box { text-align: center; padding: 40px 20px; position: relative; }
        
        .quiz-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .quiz-score-badge {
            background-color: var(--color-cream);
            color: var(--color-deep-brown);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .quiz-question { 
            font-size: 1.8rem; 
            margin-bottom: 25px; 
            color: var(--color-primary-red); 
            font-weight: bold; 
            word-wrap: break-word;
            cursor: pointer;
        }
        .quiz-question:active { transform: scale(0.98); opacity: 0.8; }
        
        .quiz-hint {
            font-size: 0.8rem;
            color: #bbb;
            margin-top: -20px;
            margin-bottom: 20px;
        }

        .quiz-input {
            width: 100%; padding: 15px; font-size: 1.2rem;
            border: 2px solid #ddd; border-radius: var(--radius);
            margin-bottom: 15px; text-align: center;
            color: var(--color-deep-brown);
            background-color: #FAFAFA;
        }
        .quiz-input:focus { outline: none; border-color: var(--color-chic-blue); background-color: #FFF; }
        
        .feedback { margin-top: 15px; font-weight: bold; min-height: 1.5em; }
        .feedback.correct { color: var(--color-chic-blue); }
        .feedback.wrong { color: var(--color-burnt-orange); }

        .result-box { text-align: center; padding: 40px 20px; }
        .result-score { font-size: 4rem; font-weight: 800; color: var(--color-chic-blue); margin: 20px 0; }
        .result-msg { font-size: 1.2rem; color: var(--color-deep-brown); margin-bottom: 30px; }

        .section-header {
            font-size: 1.2rem;
            color: var(--color-deep-brown);
            margin-bottom: 15px;
            font-weight: bold;
            border-left: 4px solid var(--color-primary-red);
            padding-left: 10px;
        }
        .lesson-meta { font-size: 0.9rem; color: #888; margin-top: 5px; }

    </style>
</head>
<body>

    <header onclick="goToLessonList()">
        ENGLISH CLASS ☕
    </header>

    <div class="container">
        
        <!-- 1. 課程列表 (Home) -->
        <div id="p-lesson-list" class="page active">
            <div class="section-header">Select a Lesson</div>
            <div id="lessonContainer"></div>
        </div>

        <!-- 2. 課程選單 (Dashboard) -->
        <div id="p-dashboard" class="page">
            <div class="card" style="text-align: center; background-color: var(--color-cream);">
                <div class="date-tag" id="dashDate" style="color: var(--color-deep-brown);">Date</div>
                <h2 id="dashTitle" style="color: var(--color-primary-red); margin: 10px 0;">Title</h2>
                <p id="dashCount" style="color: var(--color-deep-brown); opacity: 0.7;">Vocabulary Count</p>
            </div>

            <button class="btn" onclick="showPage('p-article')">1. 📖 閱讀文章 (Article)</button>
            <button class="btn" onclick="showPage('p-vocab')">2. 📝 單字表 (英-中)</button>
            <button class="btn" style="background-color: var(--color-primary-red);" onclick="showPage('p-vocab-fr')">3. 🇫🇷 法文單字表 (英-法)</button>
            
            <div style="margin: 20px 0; border-top: 1px solid #ddd;"></div>
            
            <button class="btn btn-outline" onclick="startQuiz('en-zh')">4. 🧠 測驗：英翻中</button>
            <button class="btn btn-outline" onclick="startQuiz('zh-en')">5. 🗣️ 測驗：中翻英</button>
            <button class="btn btn-outline" onclick="startQuiz('en-fr')">6. 🇫🇷 測驗：英翻法</button>
            
            <button class="btn btn-back" onclick="goToLessonList()">← 回課程列表</button>
        </div>

        <!-- 3. 文章頁面 -->
        <div id="p-article" class="page">
            <div class="card">
                <span class="date-tag" id="artDate"></span>
                <div class="article-title" id="artTitle" onclick="speak(this.innerText, 'en-US')"></div>
                <div style="font-size:0.8rem; color:#aaa; margin-top:-15px; margin-bottom:20px;">(點擊標題可朗讀)</div>
                <div class="english-text" id="artContent"></div>
                <div style="border-top: 2px dashed #ddd; padding-top: 20px; margin-top: 20px;">
                    <div style="font-weight: bold; color: var(--color-chic-blue); margin-bottom: 15px;">💬 Discussion Questions</div>
                    <div id="artQuestions"></div>
                </div>
            </div>
            <button class="btn btn-back" onclick="backToDashboard()">回課程選單</button>
        </div>

        <!-- 4. 單字頁面 (英-中) -->
        <div id="p-vocab" class="page">
            <div class="card">
                <h3 style="color: var(--color-burnt-orange); border-bottom: 2px solid var(--color-cream); padding-bottom: 10px;">Vocabulary (En-Zh)</h3>
                <p style="font-size: 0.85rem; color:#999;">💡 點擊英文單字可聽發音</p>
                <div id="vocabList"></div>
            </div>
            <button class="btn btn-back" onclick="backToDashboard()">回課程選單</button>
        </div>

        <!-- 5. 法文單字頁面 (英-法) -->
        <div id="p-vocab-fr" class="page">
            <div class="card">
                <h3 style="color: var(--color-primary-red); border-bottom: 2px solid var(--color-cream); padding-bottom: 10px;">Vocabulaire (En-Fr)</h3>
                <p style="font-size: 0.85rem; color:#999;">💡 點擊單字或句子可聽發音</p>
                <div id="vocabListFr"></div>
            </div>
            <button class="btn btn-back" onclick="backToDashboard()">回課程選單</button>
        </div>

        <!-- 6. 測驗頁面 (Quiz) -->
        <div id="p-quiz" class="page">
            <div class="card quiz-box">
                <div class="quiz-header">
                    <span id="quiz-progress">Q: 1/10</span>
                    <span id="quiz-score-display" class="quiz-score-badge">Score: 0</span>
                </div>
                
                <div style="font-size: 0.9rem; color:#ccc; margin-bottom: 10px;">
                    <span id="quizType">測驗模式</span>
                </div>
                
                <div class="quiz-question" id="q-word" onclick="speakCurrentQuizWord()"></div>
                <div id="quiz-hint-text" class="quiz-hint"></div>
                
                <input type="text" id="q-input" class="quiz-input" placeholder="輸入答案..." autocomplete="off">
                
                <button class="btn" id="btn-submit" onclick="checkAnswer()">送出答案 (Check)</button>
                <div id="q-feedback" class="feedback"></div>
                <button class="btn btn-outline" style="margin-top:10px; display:none;" id="btn-next" onclick="nextQuestion()">下一題 (Next)</button>
            </div>
            <button class="btn btn-back" onclick="backToDashboard()">放棄測驗</button>
        </div>

        <!-- 7. 結果頁面 -->
        <div id="p-result" class="page">
            <div class="card result-box">
                <div style="font-size: 1.2rem; color: #888;">Final Score</div>
                <div class="result-score" id="final-score">80</div>
                <div class="result-msg" id="final-msg">Great Job!</div>
                <p style="color:#666;" id="final-detail">You got 8 out of 10 correct.</p>
                
                <button class="btn" onclick="startQuiz(currentQuizMode)">再測驗一次 (Retry)</button>
                <button class="btn btn-outline" onclick="backToDashboard()">完成 (Finish)</button>
            </div>
        </div>

    </div>

    <script>
        /* --- 語音發音功能 --- */
        function speak(text, lang = 'en-US') {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang; 
                utterance.rate = 0.9;     
                
                const voices = window.speechSynthesis.getVoices();
                let targetVoice = null;
                if (lang === 'en-US') {
                    targetVoice = voices.find(v => v.name.includes('Google') && v.lang.includes('en-US'));
                } else if (lang === 'fr-FR') {
                    targetVoice = voices.find(v => v.name.includes('Google') && v.lang.includes('fr'));
                    if (!targetVoice) targetVoice = voices.find(v => v.lang.includes('fr'));
                }
                if (targetVoice) utterance.voice = targetVoice;

                window.speechSynthesis.speak(utterance);
            } else {
                console.log("Speech API not supported");
            }
        }

        /* --- 資料設定區 (包含法文單字與例句) --- */
        const lessons = [
            {
                id: 1,
                date: "2026.01.12",
                title: "The Morning Cafe",
                content: `The cafe is absolutely packed this morning, and the air is thick with the rich aroma of freshly roasted beans and steaming milk. While standing in line, I strike up some small talk with the person behind me to pass the time, saying, "The line is moving pretty slowly today, isn't it? I guess everyone needs their Monday morning pick-me-up." They nod in agreement while checking their watch. Suddenly, a man in a suit tries to cut in line right in front of me. I keep my cool, catch his eye, and calmly say, "Excuse me, the line starts back there." He looks embarrassed, mumbles an apology, and heads to the back of the queue.

When I finally reach the counter, the barista greets me with a tired but friendly smile and asks, "What can I get for you?" I place my order clearly: "Can I get a large decaf latte, extra hot, with oat milk? And please hold the foam." The barista notes it down on a cup and asks if I'd like to try any of their freshly baked pastries. I take a quick look at the display case—the croissants look tempting—but I ultimately decline, saying, "I'm good, thanks."

Then comes the payment. I ask, "Do you take contactless?" She points to the card reader, and I tap my card. It beeps instantly to confirm the transaction. She asks if I want a receipt printed, but I tell her, "No need, thanks! Have a good one." Finally, I head over to the crowded pickup counter. I find a small napkin and a stirrer at the condiment station while I wait for the barista to call my name. Once I grab my cup, I’m finally ready to start my day with my caffeine fix.`,
                questions: [
                    "Have you ever had the experience where someone tried to cut in line in front of you?",
                    "Do you usually need a caffeine fix to feel awake, or are you naturally energetic?",
                    "Are you 'picky' about your order at a cafe, or do you take whatever is on the menu?",
                    "Do you find it easy to strike up small talk with strangers?",
                    "Do you prefer to tap your card for contactless transaction or use cash?"
                ],
                vocab: [
                    { en: "thick", zh: "很濃、很厚", fr: "épais", ex: "The fog was so thick I couldn't see the road.", fr_ex: "Le brouillard était si épais que je ne voyais pas la route." },
                    { en: "aroma", zh: "香氣", fr: "arôme", ex: "The aroma of fresh coffee filled the kitchen.", fr_ex: "L'arôme du café frais remplissait la cuisine." },
                    { en: "roasted beans", zh: "烘焙過的咖啡豆", fr: "grains torréfiés", ex: "They use locally roasted beans here.", fr_ex: "Ils utilisent des grains torréfiés localement." },
                    { en: "steaming milk", zh: "熱呼呼冒煙的牛奶", fr: "lait fumant", ex: "He poured steaming milk into the cup.", fr_ex: "Il a versé du lait fumant dans la tasse." },
                    { en: "strike up", zh: "主動聊起來", fr: "entamer", ex: "I tried to strike up a conversation with her.", fr_ex: "J'ai essayé d'entamer une conversation avec elle." },
                    { en: "cut in line", zh: "插隊", fr: "doubler dans la file", ex: "It is rude to cut in line.", fr_ex: "Il est impoli de doubler dans la file." },
                    { en: "calmly", zh: "很冷靜地", fr: "calmement", ex: "She spoke calmly despite the chaos.", fr_ex: "Elle a parlé calmement malgré le chaos." },
                    { en: "nod", zh: "點點頭", fr: "hocher la tête", ex: "He gave a nod of agreement.", fr_ex: "Il a hoché la tête en signe d'accord." },
                    { en: "the line starts back there", zh: "隊伍在後面那邊喔", fr: "la queue commence là-bas", ex: "Excuse me, the line starts back there.", fr_ex: "Excusez-moi, la queue commence là-bas." },
                    { en: "mumbles", zh: "小聲嘟囔", fr: "marmonne", ex: "He mumbles when he is nervous.", fr_ex: "Il marmonne quand il est nerveux." },
                    { en: "queue", zh: "排隊的人龍", fr: "file d'attente", ex: "There was a long queue for the tickets.", fr_ex: "Il y avait une longue file d'attente pour les billets." },
                    { en: "barista", zh: "咖啡師", fr: "barista", ex: "The barista made a beautiful latte art.", fr_ex: "Le barista a fait un beau dessin sur mon latte." },
                    { en: "greets", zh: "打招呼", fr: "salue", ex: "The dog greets me at the door every day.", fr_ex: "Le chien me salue à la porte chaque jour." },
                    { en: "place my order", zh: "點餐", fr: "passer ma commande", ex: "I am ready to place my order now.", fr_ex: "Je suis prêt à passer ma commande maintenant." },
                    { en: "extra hot", zh: "特別燙", fr: "très chaud", ex: "Can I have my tea extra hot?", fr_ex: "Puis-je avoir mon thé très chaud ?" },
                    { en: "hold the foam", zh: "不要奶泡", fr: "sans mousse", ex: "I'll have a latte, hold the foam.", fr_ex: "Je prendrai un latte, sans mousse." },
                    { en: "pastries", zh: "甜點/糕點", fr: "pâtisseries", ex: "They sell fresh pastries every morning.", fr_ex: "Ils vendent des pâtisseries fraîches tous les matins." },
                    { en: "display case", zh: "展示櫃", fr: "vitrine", ex: "Look at the cakes in the display case.", fr_ex: "Regardez les gâteaux dans la vitrine." },
                    { en: "ultimately", zh: "最後還是", fr: "finalement", ex: "Ultimately, the decision is yours.", fr_ex: "Finalement, la décision vous appartient." },
                    { en: "decline", zh: "婉拒", fr: "refuser", ex: "I have to decline your invitation.", fr_ex: "Je dois refuser votre invitation." },
                    { en: "contactless", zh: "非接觸式", fr: "sans contact", ex: "Do you accept contactless payment?", fr_ex: "Acceptez-vous le paiement sans contact ?" },
                    { en: "tap my card", zh: "感應付款", fr: "poser ma carte", ex: "Just tap your card on the machine.", fr_ex: "Posez simplement votre carte sur la machine." },
                    { en: "transaction", zh: "交易", fr: "transaction", ex: "The transaction was successful.", fr_ex: "La transaction a été réussie." },
                    { en: "over to the crowded", zh: "走向擁擠的...", fr: "vers la foule", ex: "He walked over to the crowded bar.", fr_ex: "Il s'est dirigé vers le bar bondé." },
                    { en: "pickup counter", zh: "取餐櫃檯", fr: "comptoir de retrait", ex: "Please wait at the pickup counter.", fr_ex: "Veuillez attendre au comptoir de retrait." },
                    { en: "napkin", zh: "紙巾", fr: "serviette", ex: "May I have a napkin, please?", fr_ex: "Puis-je avoir une serviette, s'il vous plaît ?" },
                    { en: "stirrer", zh: "攪拌棒", fr: "touillette", ex: "Use a stirrer to mix your sugar.", fr_ex: "Utilisez une touillette pour mélanger votre sucre." },
                    { en: "condiment station", zh: "自助調味區", fr: "station de condiments", ex: "You can find sugar at the condiment station.", fr_ex: "Vous trouverez du sucre à la station de condiments." },
                    { en: "grab my cup", zh: "拿起我的咖啡", fr: "prendre ma tasse", ex: "I grabbed my cup and left quickly.", fr_ex: "J'ai pris ma tasse et je suis parti rapidement." },
                    { en: "caffeine fix", zh: "今日咖啡續命成功", fr: "dose de caféine", ex: "I really need my afternoon caffeine fix.", fr_ex: "J'ai vraiment besoin de ma dose de caféine de l'après-midi." }
                ]
            },
            {
                id: 2,
                date: "2026.01.16",
                title: "The Weekend Costco Hustle",
                content: `If you're brave enough to tackle Costco on a Saturday, you’d better have a game plan. I pulled into the lot at 10:00 AM, and it was already a madhouse. After doing three laps just to find a parking spot, I finally made it inside. I showed my membership card to the greeter and grabbed a cart—which, as always, felt like steering a small boat.

The weekend energy at Costco is on another level. It’s not just shopping; it’s an event. I started in the produce cold room—that giant walk-in fridge where you freezing your toes off just to get a massive bag of organic kale. From there, I headed to the meat department. Since I was hosting a BBQ later, I picked up a "family-sized" pack of steaks.

The real challenge on weekends is navigating the sample stations. Every corner had a long line of people waiting for a tiny square of pizza or a toothpick with a piece of sausage. It’s a total bottleneck, and you have to be careful not to get rear-ended by another giant cart while you're distracted by the snacks!

I tried to stick to my shopping list, but I got distracted in the "Middle Aisle"—the place where Costco puts all the random stuff like kayaks, air fryers, and giant outdoor umbrellas. I ended up impulse buying a set of high-quality mixing bowls because the markdown price was just too good to pass up.

By the time I hit the checkout line, it was backed up halfway to the back of the store. Luckily, the staff were hustling, and the line moved fast. I didn't bother with bags because Costco doesn't have them; I just grabbed a couple of sturdy discarded boxes from the pile near the registers. I finished the trip with the ultimate reward: a $1.50 hot dog and soda combo. It’s the only thing in the world that hasn't gone up in price!`,
                questions: [
                    "Do you prefer to go during the busy weekend or avoid crowds?",
                    "Are you easily distracted by random items in the 'Middle Aisle'?",
                    "Do you think waiting for a 'tiny square of pizza' is worth it?",
                    "What is your favorite 'guilty pleasure' snack?"
                ],
                vocab: [
                    { en: "a madhouse", zh: "亂哄哄的地方", fr: "une maison de fous", ex: "The shopping mall was a madhouse on Christmas Eve.", fr_ex: "Le centre commercial était une maison de fous la veille de Noël." },
                    { en: "to do laps", zh: "繞圈子", fr: "faire des tours", ex: "We had to do laps around the block to find parking.", fr_ex: "Nous avons dû faire des tours du pâté de maisons pour trouver une place." },
                    { en: "steering a boat", zh: "像在開船一樣難操控", fr: "manœuvrer un bateau", ex: "Pushing this heavy cart feels like steering a boat.", fr_ex: "Pousser ce chariot lourd donne l'impression de manœuvrer un bateau." },
                    { en: "freezing your toes off", zh: "凍到腳趾掉下來", fr: "se geler les orteils", ex: "It's freezing your toes off in this cold room!", fr_ex: "On se gèle les orteils dans cette chambre froide !" },
                    { en: "a bottleneck", zh: "瓶頸、擁擠堵塞處", fr: "un goulot d'étranglement", ex: "The construction caused a huge bottleneck on the highway.", fr_ex: "Les travaux ont causé un énorme goulot d'étranglement sur l'autoroute." },
                    { en: "to get rear-ended", zh: "被追撞", fr: "se faire rentrer dedans", ex: "I got rear-ended at the stop light yesterday.", fr_ex: "Je me suis fait rentrer dedans au feu rouge hier." },
                    { en: "impulse buy", zh: "衝動購物", fr: "achat impulsif", ex: "Those candy bars at the checkout are a classic impulse buy.", fr_ex: "Ces barres chocolatées à la caisse sont un achat impulsif classique." },
                    { en: "to pass up", zh: "錯過、放過機會", fr: "laisser passer", ex: "This deal is too good to pass up.", fr_ex: "Cette offre est trop belle pour la laisser passer." }
                ]
            }
        ];

        /* --- 系統邏輯 --- */
        let currentLesson = null;

        // 1. 初始化
        function initApp() {
            const listContainer = document.getElementById('lessonContainer');
            listContainer.innerHTML = ''; 
            lessons.forEach((lesson, index) => {
                listContainer.innerHTML += `
                    <div class="card lesson-card" onclick="selectLesson(${index})">
                        <span class="date-tag">${lesson.date}</span>
                        <div style="font-size:1.3rem; font-weight:bold; color:var(--color-primary-red); margin: 5px 0;">${lesson.title}</div>
                        <div class="lesson-meta">${lesson.vocab.length} Words</div>
                    </div>
                `;
            });
        }

        // 2. 選擇課程
        function selectLesson(index) {
            currentLesson = lessons[index];
            document.getElementById('dashDate').innerText = currentLesson.date;
            document.getElementById('dashTitle').innerText = currentLesson.title;
            document.getElementById('dashCount').innerText = `${currentLesson.vocab.length} Key Vocabulary Words`;

            document.getElementById('artDate').innerText = currentLesson.date;
            document.getElementById('artTitle').innerText = currentLesson.title;
            document.getElementById('artContent').innerHTML = currentLesson.content.replace(/\n\n/g, '<br><br>');
            
            const qContainer = document.getElementById('artQuestions');
            qContainer.innerHTML = '';
            currentLesson.questions.forEach(q => {
                qContainer.innerHTML += `<div style="margin-bottom:10px; padding-left:10px; border-left:3px solid var(--color-burnt-orange); color:#555;">${q}</div>`;
            });

            // 渲染一般單字表 (En-Zh)
            const vContainer = document.getElementById('vocabList');
            vContainer.innerHTML = '';
            currentLesson.vocab.forEach(item => {
                const cleanEn = item.en.replace(/'/g, "\\'");
                const cleanEx = item.ex.replace(/'/g, "\\'");
                
                vContainer.innerHTML += `
                    <div class="vocab-item">
                        <div class="vocab-header">
                            <span class="vocab-en" onclick="speak('${cleanEn}', 'en-US')">
                                ${item.en} 
                                <span class="speaker-icon">🔊</span>
                            </span>
                            <span class="vocab-zh">${item.zh}</span>
                        </div>
                        <div class="vocab-ex" onclick="speak('${cleanEx}', 'en-US')">Ex: ${item.ex}</div>
                    </div>
                `;
            });

            // 渲染法文單字表 (En-Fr)
            const vFrContainer = document.getElementById('vocabListFr');
            vFrContainer.innerHTML = '';
            currentLesson.vocab.forEach(item => {
                const cleanEn = item.en.replace(/'/g, "\\'");
                const cleanFr = item.fr.replace(/'/g, "\\'");
                const cleanFrEx = item.fr_ex ? item.fr_ex.replace(/'/g, "\\'") : "";
                
                vFrContainer.innerHTML += `
                    <div class="vocab-item">
                        <div class="vocab-header">
                            <span class="vocab-en" onclick="speak('${cleanEn}', 'en-US')">
                                ${item.en} 
                                <span class="speaker-icon">🔊</span>
                            </span>
                        </div>
                        <div class="vocab-fr-row" onclick="speak('${cleanFr}', 'fr-FR')">
                            🇫🇷 ${item.fr}
                            <span class="speaker-icon" style="background-color: #fee; margin-left: 10px;">🔊</span>
                        </div>
                        ${cleanFrEx ? `<div class="vocab-ex-fr" onclick="speak('${cleanFrEx}', 'fr-FR')">Ex: ${item.fr_ex}</div>` : ''}
                    </div>
                `;
            });

            showPage('p-dashboard');
        }

        /* --- 頁面導航 --- */
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0); 
            if(pageId === 'p-dashboard') resetQuizUI();
        }

        function goToLessonList() { showPage('p-lesson-list'); }
        function backToDashboard() { showPage('p-dashboard'); }

        /* --- 測驗系統邏輯 --- */
        let currentQuizMode = ''; 
        let currentTargetWord = null;
        let quizScore = 0;
        let quizQuestionCount = 0;
        const QUESTIONS_PER_ROUND = 10;

        function startQuiz(mode) {
            currentQuizMode = mode;
            quizScore = 0;
            quizQuestionCount = 0;
            
            let title = '';
            if(mode === 'en-zh') title = '請翻譯成中文';
            else if(mode === 'zh-en') title = 'Translate to English';
            else if(mode === 'en-fr') title = 'Traduisez en Français (翻譯成法文)';
            
            document.getElementById('quizType').innerText = title;
            
            const hintEl = document.getElementById('quiz-hint-text');
            if (mode === 'en-zh' || mode === 'en-fr') {
                hintEl.innerText = "💡 點擊單字可聽發音";
                hintEl.style.display = 'block';
            } else {
                hintEl.style.display = 'none';
            }

            showPage('p-quiz');
            updateQuizHeader();
            nextQuestion();
        }

        function updateQuizHeader() {
            document.getElementById('quiz-progress').innerText = `Q: ${quizQuestionCount + 1}/${QUESTIONS_PER_ROUND}`;
            document.getElementById('quiz-score-display').innerText = `Score: ${quizScore}`;
        }

        function speakCurrentQuizWord() {
            if ((currentQuizMode === 'en-zh' || currentQuizMode === 'en-fr') && currentTargetWord) {
                speak(currentTargetWord.en, 'en-US');
            }
        }

        function nextQuestion() {
            if (quizQuestionCount >= QUESTIONS_PER_ROUND) {
                showResult();
                return;
            }

            resetQuizUI();
            updateQuizHeader();

            const randomIndex = Math.floor(Math.random() * currentLesson.vocab.length);
            currentTargetWord = currentLesson.vocab[randomIndex];
            
            if (currentQuizMode === 'en-zh' || currentQuizMode === 'en-fr') {
                document.getElementById('q-word').innerText = currentTargetWord.en;
            } else {
                document.getElementById('q-word').innerText = currentTargetWord.zh;
            }
        }

        function checkAnswer() {
            const inputVal = document.getElementById('q-input').value.trim().toLowerCase();
            const feedbackEl = document.getElementById('q-feedback');
            const nextBtn = document.getElementById('btn-next');
            const submitBtn = document.getElementById('btn-submit');
            
            let isCorrect = false;
            let correctAnswer = '';

            if (currentQuizMode === 'en-zh') {
                correctAnswer = currentTargetWord.zh;
                if ((correctAnswer.includes(inputVal) && inputVal.length > 1) || inputVal === correctAnswer) {
                    isCorrect = true;
                }
            } else if (currentQuizMode === 'zh-en') {
                correctAnswer = currentTargetWord.en;
                if (inputVal === correctAnswer.toLowerCase()) {
                    isCorrect = true;
                }
            } else if (currentQuizMode === 'en-fr') {
                correctAnswer = currentTargetWord.fr;
                if (inputVal === correctAnswer.toLowerCase()) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                feedbackEl.innerText = "🎉 Correct! 答對了！";
                feedbackEl.className = "feedback correct";
                quizScore++;
            } else {
                feedbackEl.innerText = `❌ 答案是: ${correctAnswer}`;
                feedbackEl.className = "feedback wrong";
            }
            
            if (!isCorrect) {
                if (currentQuizMode === 'zh-en') speak(currentTargetWord.en, 'en-US');
                if (currentQuizMode === 'en-fr') speak(currentTargetWord.fr, 'fr-FR');
            }
            
            submitBtn.style.display = 'none';
            nextBtn.style.display = "block";
            
            quizQuestionCount++;
        }

        function showResult() {
            const finalScore = Math.round((quizScore / QUESTIONS_PER_ROUND) * 100);
            document.getElementById('final-score').innerText = finalScore;
            document.getElementById('final-detail').innerText = `You got ${quizScore} out of ${QUESTIONS_PER_ROUND} correct.`;
            
            let msg = "";
            if(finalScore === 100) msg = "Perfect! 💯";
            else if(finalScore >= 80) msg = "Excellent! 🌟";
            else if(finalScore >= 60) msg = "Good Job! 👍";
            else msg = "Keep Practicing! 💪";
            
            document.getElementById('final-msg').innerText = msg;
            showPage('p-result');
        }

        function resetQuizUI() {
            document.getElementById('q-input').value = '';
            document.getElementById('q-feedback').innerText = '';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';
        }

        initApp();
    </script>
</body>
</html>
