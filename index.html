<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English & French Learning App</title>
    <style>
        /* --- 介面風格設計 (CSS) - Lady B 復古配色版 --- */
        :root {
            --color-primary-red: #7D2027;   /* 酒紅 */
            --color-chic-blue: #5FA8C2;     /* 復古藍 */
            --color-burnt-orange: #CF5527;  /* 焦糖橘 */
            --color-deep-brown: #673C34;    /* 深棕 */
            --color-cream: #FAE3B1;         /* 奶油黃 */
            
            --color-bg: #FDFBF6;            /* 極淡米色背景 */
            --color-card-bg: #FFFFFF;       /* 卡片白 */
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-deep-brown);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--color-primary-red);
            color: #FFFFFF;
            padding: 20px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(125, 32, 39, 0.3);
            cursor: pointer;
            z-index: 10;
        }

        .container {
            padding: 20px;
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: var(--color-card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(103, 60, 52, 0.08);
            margin-bottom: 20px;
            line-height: 1.8;
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }
        
        .lesson-card {
            cursor: pointer;
            border-left: 6px solid var(--color-chic-blue);
        }
        .lesson-card:active {
            transform: scale(0.98);
            background-color: #f9f9f9;
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 按鈕樣式 */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background-color: var(--color-chic-blue);
            color: #FFFFFF;
            text-align: center;
            border: none;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--color-chic-blue);
            color: var(--color-chic-blue);
        }

        .btn-back {
            background-color: #EFEFEF;
            color: var(--color-deep-brown);
            margin-top: 30px;
        }
        
        /* 文章播放按鈕 */
        .btn-audio {
            background-color: var(--color-primary-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        .btn-audio.playing {
            background-color: #333;
        }
        .btn-audio:active { transform: scale(0.95); }

        /* 文字樣式 */
        .date-tag {
            font-size: 0.85rem;
            color: #998731;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .article-title {
            color: var(--color-burnt-orange);
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 800;
            line-height: 1.3;
        }
        .english-text {
            font-size: 1.1rem;
            text-align: justify;
            margin-bottom: 30px;
            color: #4a3b38;
        }

        /* 發音技巧區塊 */
        .pronunciation-box {
            background-color: #f0f8ff;
            border-left: 4px solid var(--color-chic-blue);
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
        .pronunciation-title {
            font-weight: bold;
            color: var(--color-chic-blue);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        /* KK音標表格/列表 */
        .kk-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .kk-table th, .kk-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .kk-table th {
            background-color: #e6f7ff;
            color: var(--color-chic-blue);
            width: 40px;
            text-align: center;
        }
        
        .kk-list {
            padding-left: 10px;
            line-height: 1.8;
            color: #444;
        }
        .kk-symbol {
            font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif;
            color: var(--color-primary-red);
            font-weight: bold;
            background-color: #fff;
            padding: 0 4px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-right: 5px;
        }

        /* 單字列表樣式 */
        .vocab-item {
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .vocab-item:last-child { border-bottom: none; }
        
        .vocab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }
        
        .vocab-en { 
            font-weight: bold; 
            color: var(--color-chic-blue); 
            font-size: 1.2rem; 
            cursor: pointer;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
        }
        .vocab-en:active { opacity: 0.6; }
        
        /* 單字旁的音標 */
        .vocab-ipa {
            font-size: 0.9rem;
            color: #999;
            font-weight: normal;
            margin-left: 8px;
            font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif;
        }

        .speaker-icon {
            font-size: 0.9rem;
            margin-left: 8px;
            background-color: #eee;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }

        .vocab-zh { 
            color: var(--color-deep-brown); 
            font-size: 1rem; 
            font-weight: bold;
        }
        
        .vocab-fr-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            color: var(--color-primary-red); 
            font-size: 1rem; 
            font-weight: bold;
            font-style: italic;
            cursor: pointer;
        }
        .vocab-fr-row:active { opacity: 0.6; }

        .vocab-ex {
            font-size: 0.95rem;
            color: #666;
            font-style: italic;
            background-color: #FAFAFA;
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--color-cream);
            line-height: 1.4;
            cursor: pointer;
            margin-top: 8px;
        }
        
        .vocab-ex-fr {
            font-size: 0.95rem;
            color: #7D2027; 
            font-style: italic;
            background-color: #FFF5F5; 
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--color-primary-red);
            line-height: 1.4;
            cursor: pointer;
            margin-top: 8px;
        }

        /* 測驗區塊樣式 */
        .quiz-box { text-align: center; padding: 40px 20px; position: relative; }
        
        .quiz-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .quiz-score-badge {
            background-color: var(--color-cream);
            color: var(--color-deep-brown);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .quiz-question { 
            font-size: 1.8rem; 
            margin-bottom: 25px; 
            color: var(--color-primary-red); 
            font-weight: bold; 
            word-wrap: break-word;
            cursor: pointer;
        }
        .quiz-question:active { transform: scale(0.98); opacity: 0.8; }
        
        .quiz-hint {
            font-size: 0.8rem;
            color: #bbb;
            margin-top: -20px;
            margin-bottom: 20px;
        }

        .quiz-input {
            width: 100%; padding: 15px; font-size: 1.2rem;
            border: 2px solid #ddd; border-radius: var(--radius);
            margin-bottom: 15px; text-align: center;
            color: var(--color-deep-brown);
            background-color: #FAFAFA;
        }
        .quiz-input:focus { outline: none; border-color: var(--color-chic-blue); background-color: #FFF; }
        
        .feedback { margin-top: 15px; font-weight: bold; min-height: 1.5em; }
        .feedback.correct { color: var(--color-chic-blue); }
        .feedback.wrong { color: var(--color-burnt-orange); }

        .result-box { text-align: center; padding: 40px 20px; }
        .result-score { font-size: 4rem; font-weight: 800; color: var(--color-chic-blue); margin: 20px 0; }
        .result-msg { font-size: 1.2rem; color: var(--color-deep-brown); margin-bottom: 30px; }

        .section-header {
            font-size: 1.2rem;
            color: var(--color-deep-brown);
            margin-bottom: 15px;
            font-weight: bold;
            border-left: 4px solid var(--color-primary-red);
            padding-left: 10px;
        }
        .lesson-meta { font-size: 0.9rem; color: #888; margin-top: 5px; }

    </style>
</head>
<body>

    <header onclick="goToLessonList()">
        ENGLISH CLASS ☕
    </header>

    <div class="container">
        
        <!-- 1. 課程列表 (Home) -->
        <div id="p-lesson-list" class="page active">
            <div class="section-header">Select a Lesson</div>
            <div id="lessonContainer"></div>
        </div>

        <!-- 2. 課程選單 (Dashboard) -->
        <div id="p-dashboard" class="page">
            <div class="card" style="text-align: center; background-color: var(--color-cream);">
                <div class="date-tag" id="dashDate" style="color: var(--color-deep-brown);">Date</div>
                <h2 id="dashTitle" style="color: var(--color-primary-red); margin: 10px 0;">Title</h2>
                <p id="dashCount" style="color: var(--color-deep-brown); opacity: 0.7;">Vocabulary Count</p>
            </div>

            <button class="btn" onclick="showPage('p-article')">1. 📖 閱讀文章 (Article)</button>
            <button class="btn" onclick="showPage('p-vocab')">2. 📝 單字表 (英-中)</button>
            <button class="btn" style="background-color: var(--color-primary-red);" onclick="showPage('p-vocab-fr')">3. 🇫🇷 法文單字表 (英-法)</button>
            
            <div style="margin: 20px 0; border-top: 1px solid #ddd;"></div>
            
            <button class="btn btn-outline" onclick="startQuiz('en-zh')">4. 🧠 測驗：英翻中</button>
            <button class="btn btn-outline" onclick="startQuiz('zh-en')">5. 🗣️ 測驗：中翻英</button>
            <button class="btn btn-outline" onclick="startQuiz('en-fr')">6. 🇫🇷 測驗：英翻法</button>
            
            <button class="btn btn-back" onclick="goToLessonList()">← 回課程列表</button>
        </div>

        <!-- 3. 文章頁面 -->
        <div id="p-article" class="page">
            <div class="card">
                <span class="date-tag" id="artDate"></span>
                <div class="article-title" id="artTitle" onclick="speak(this.innerText, 'en-US')"></div>
                
                <!-- 全文朗讀按鈕 (切換式) -->
                <button id="btn-audio-toggle" class="btn-audio" onclick="toggleArticleAudio()">
                    <span>🔊 播放文章朗讀 (Play Audio)</span>
                </button>

                <div class="english-text" id="artContent"></div>
                
                <!-- 發音技巧區塊 -->
                <div id="artPronunciation"></div>

                <div style="border-top: 2px dashed #ddd; padding-top: 20px; margin-top: 20px;">
                    <div style="font-weight: bold; color: var(--color-chic-blue); margin-bottom: 15px;">💬 Discussion Questions</div>
                    <div id="artQuestions"></div>
                </div>
            </div>
            <button class="btn btn-back" onclick="backToDashboard()">回課程選單</button>
        </div>

        <!-- 4. 單字頁面 (英-中) -->
        <div id="p-vocab" class="page">
            <div class="card">
                <h3 style="color: var(--color-burnt-orange); border-bottom: 2px solid var(--color-cream); padding-bottom: 10px;">Vocabulary (En-Zh)</h3>
                <p style="font-size: 0.85rem; color:#999;">💡 點擊英文單字可聽發音</p>
                <div id="vocabList"></div>
            </div>
            <button class="btn btn-back" onclick="backToDashboard()">回課程選單</button>
        </div>

        <!-- 5. 法文單字頁面 (英-法) -->
        <div id="p-vocab-fr" class="page">
            <div class="card">
                <h3 style="color: var(--color-primary-red); border-bottom: 2px solid var(--color-cream); padding-bottom: 10px;">Vocabulaire (En-Fr)</h3>
                <p style="font-size: 0.85rem; color:#999;">💡 點擊單字或句子可聽發音</p>
                <div id="vocabListFr"></div>
            </div>
            <button class="btn btn-back" onclick="backToDashboard()">回課程選單</button>
        </div>

        <!-- 6. 測驗頁面 (Quiz) -->
        <div id="p-quiz" class="page">
            <div class="card quiz-box">
                <div class="quiz-header">
                    <span id="quiz-progress">Q: 1/10</span>
                    <span id="quiz-score-display" class="quiz-score-badge">Score: 0</span>
                </div>
                
                <div style="font-size: 0.9rem; color:#ccc; margin-bottom: 10px;">
                    <span id="quizType">測驗模式</span>
                </div>
                
                <div class="quiz-question" id="q-word" onclick="speakCurrentQuizWord()"></div>
                <div id="quiz-hint-text" class="quiz-hint"></div>
                
                <input type="text" id="q-input" class="quiz-input" placeholder="輸入答案..." autocomplete="off">
                
                <button class="btn" id="btn-submit" onclick="checkAnswer()">送出答案 (Check)</button>
                <div id="q-feedback" class="feedback"></div>
                <button class="btn btn-outline" style="margin-top:10px; display:none;" id="btn-next" onclick="nextQuestion()">下一題 (Next)</button>
            </div>
            <button class="btn btn-back" onclick="backToDashboard()">放棄測驗</button>
        </div>

        <!-- 7. 結果頁面 -->
        <div id="p-result" class="page">
            <div class="card result-box">
                <div style="font-size: 1.2rem; color: #888;">Final Score</div>
                <div class="result-score" id="final-score">80</div>
                <div class="result-msg" id="final-msg">Great Job!</div>
                <p style="color:#666;" id="final-detail">You got 8 out of 10 correct.</p>
                
                <button class="btn" onclick="startQuiz(currentQuizMode)">再測驗一次 (Retry)</button>
                <button class="btn btn-outline" onclick="backToDashboard()">完成 (Finish)</button>
            </div>
        </div>

    </div>

    <script>
        /* --- 語音發音功能 (含停止) --- */
        function speak(text, lang = 'en-US', onEndCallback) {
            if ('speechSynthesis' in window) {
                if (!onEndCallback) {
                    window.speechSynthesis.cancel();
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang; 
                utterance.rate = 0.9;     
                
                const voices = window.speechSynthesis.getVoices();
                let targetVoice = null;
                if (lang === 'en-US') {
                    targetVoice = voices.find(v => v.name.includes('Google') && v.lang.includes('en-US'));
                } else if (lang === 'fr-FR') {
                    targetVoice = voices.find(v => v.name.includes('Google') && v.lang.includes('fr'));
                    if (!targetVoice) targetVoice = voices.find(v => v.lang.includes('fr'));
                }
                if (targetVoice) utterance.voice = targetVoice;

                if (onEndCallback) {
                    utterance.onend = onEndCallback;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                console.log("Speech API not supported");
            }
        }

        function stopAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            resetAudioButton();
        }

        function toggleArticleAudio() {
            const btn = document.getElementById('btn-audio-toggle');
            if (window.speechSynthesis.speaking) {
                stopAudio();
            } else {
                if(currentLesson) {
                    btn.innerHTML = '<span>⏹️ 停止朗讀 (Stop Audio)</span>';
                    btn.classList.add('playing');
                    
                    speak(currentLesson.content, 'en-US', function() {
                        resetAudioButton();
                    });
                }
            }
        }

        function resetAudioButton() {
            const btn = document.getElementById('btn-audio-toggle');
            if(btn) {
                btn.innerHTML = '<span>🔊 播放文章朗讀 (Play Audio)</span>';
                btn.classList.remove('playing');
            }
        }

        /* --- 資料設定區 (已新增第十三堂課) --- */
        const lessons =[
            // 省略前面的 Lesson，若需保留之前全部課程，請將前面的物件照舊貼在這裡即可
            // (此處僅示範第12和第13課以確保長度不超過)
            {
                id: 12,
                date: "2026.04.02",
                title: "Chasing the Northern Lights: My Iceland Trip",
                content: `If you are looking for the ultimate "cool" vacation, Iceland is the place to be. It is a small island in the North, but it has a very big personality. People call it the land of "Fire and Ice" because you can see a frozen glacier and a steaming volcano on the same day!

My favorite part of the lifestyle there is the Blue Lagoon. It is a giant, milky-blue outdoor spa. Even when the weather is freezing, the water is like a warm bath. It is the perfect spot for relaxing and taking a deep breath of fresh air. It’s great for your health and makes your skin feel amazing.

At night, everyone looks at the sky to find the Northern Lights. When the green and purple lights start to dance, it is a breathless moment. You feel so small under the huge, dark sky.

The best way to explore is to hit the paths along the coast. You can see tiny puffins and beautiful waterfalls. The vibe in Iceland is very calm and quiet. If you need to hit the "reset" button on your life, a trip to the North is exactly what you need. It is a bucket-list dream come true!`,
                questions:[
                    "Iceland is very cold, but the Blue Lagoon is very warm. Do you prefer swimming in hot water when it is cold outside, or do you prefer the beach in the summer?",
                    "The article says Iceland is a 'bucket list' trip. What is one country on your bucket list? Why do you want to go there?",
                    "If you had to choose, would you rather hike on a frozen glacier or walk near a smoking volcano?"
                ],
                pronunciation:[
                    { title: "KK 音標 - 母音 (Vowels)", pairs: `
                        <table class="kk-table">
                            <tr><th>[ɪ]</th><td>比「一」短，嘴角放鬆 (sit, pig)</td></tr>
                            <tr><th>[ɛ]</th><td>像中文「ㄝ」，嘴角略向外撇 (bed, ten)</td></tr>
                            <tr><th>[æ]</th><td>蝴蝶音，嘴巴開最大，舌尖抵下齒背 (cat, bag)</td></tr>
                            <tr><th>[ɑ]</th><td>像看醫生說「啊」，嘴巴呈長圓形 (hot, box)</td></tr>
                            <tr><th>[ʌ]</th><td>短促的「啊」，像被揍肚子發出的聲音 (cup, bus)</td></tr>
                            <tr><th>[ʊ]</th><td>比「烏」短，嘴唇放鬆不嘟起 (foot, book)</td></tr>
                            <tr><th>[ə]</th><td>懶人音，最放鬆的聲音 (about, sofa)</td></tr>
                            <tr><th>[i]</th><td>嘴巴拉長像微笑的「一」 (see, eat)</td></tr>
                            <tr><th>[e]</th><td>像「ㄟ～」，結尾帶點 [ɪ] (name, day)</td></tr>
                            <tr><th>[u]</th><td>圓唇的「屋」 (moon, blue)</td></tr>
                            <tr><th>[o]</th><td>像「歐～」，結尾嘴唇收圓 (go, home)</td></tr>
                            <tr><th>[aɪ]</th><td>像中文「愛」 (my, kite)</td></tr>
                            <tr><th>[aʊ]</th><td>像中文「凹」 (how, now)</td></tr>
                            <tr><th>[ɔɪ]</th><td>像「歐一」連讀 (boy, noise)</td></tr>
                            <tr><th>[ɝ]</th><td>重音節的捲舌音 (bird, her)</td></tr>
                            <tr><th>[ɚ]</th><td>非重音節的捲舌音（輕聲） (teacher, mother)</td></tr>
                        </table>
                    ` }
                ],
                vocab: [
                    { en: "chase", ipa: "[tʃeɪs]", zh: "追逐", fr: "chasser", ex: "We are chasing the Northern Lights.", fr_ex: "Nous chassons les aurores boréales." },
                    { en: "Northern Lights", ipa: "[ˈnɔrðərn laɪts]", zh: "北極光", fr: "aurores boréales", ex: "The Northern Lights are beautiful.", fr_ex: "Les aurores boréales sont magnifiques." },
                    { en: "ultimate", ipa: "[ˈʌltəmət]", zh: "終極的", fr: "ultime", ex: "This is the ultimate vacation.", fr_ex: "C'est les vacances ultimes." },

            } else if (currentQuizMode === 'en-fr') {
                correctAnswer = currentTargetWord.fr;
                if (inputVal === correctAnswer.toLowerCase()) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                feedbackEl.innerText = "🎉 Correct! 答對了！";
                feedbackEl.className = "feedback correct";
                quizScore++;
            } else {
                feedbackEl.innerText = `❌ 答案是: ${correctAnswer}`;
                feedbackEl.className = "feedback wrong";
            }
            
            if (!isCorrect) {
                if (currentQuizMode === 'zh-en') speak(currentTargetWord.en, 'en-US');
                if (currentQuizMode === 'en-fr') speak(currentTargetWord.fr, 'fr-FR');
            }
            
            submitBtn.style.display = 'none';
            nextBtn.style.display = "block";
            
            quizQuestionCount++;
        }

        function showResult() {
            const finalScore = Math.round((quizScore / QUESTIONS_PER_ROUND) * 100);
            document.getElementById('final-score').innerText = finalScore;
            document.getElementById('final-detail').innerText = `You got ${quizScore} out of ${QUESTIONS_PER_ROUND} correct.`;
            
            let msg = "";
            if(finalScore === 100) msg = "Perfect! 💯";
            else if(finalScore >= 80) msg = "Excellent! 🌟";
            else if(finalScore >= 60) msg = "Good Job! 👍";
            else msg = "Keep Practicing! 💪";
            
            document.getElementById('final-msg').innerText = msg;
            showPage('p-result');
        }

        function resetQuizUI() {
            document.getElementById('q-input').value = '';
            document.getElementById('q-feedback').innerText = '';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';
        }

        initApp();
    </script>
</body>
</html>
